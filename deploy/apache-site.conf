ServerTokens Prod
ServerName localhost

<VirtualHost *:80>
    DocumentRoot /srv/people-suite/public
    ServerSignature Off

    <Directory /srv/people-suite/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /index.php
        AddType text/javascript .js

        <Files "workspace.html">
            Require all denied
        </Files>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
